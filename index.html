<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CURAQ Dark</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="toast-box"></div>
    <div id="loader-overlay"><div class="spinner"></div></div>

    <div id="app">
        
        <div id="view-auth" class="screen active center-content">
            <div class="auth-card">
                <div class="brand">
                    <div class="logo-exclamation">!</div>
                    <h1>CURAQ</h1>
                    <p>Sistema Integral de Urología</p>
                </div>
                
                <form id="form-login">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="Correo electrónico" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-pass" placeholder="Contraseña" required>
                    </div>
                    <button type="submit" class="btn-primary btn-block btn-lg">Iniciar Sesión</button>
                    <p class="auth-switch" id="btn-to-reg">Crear usuario nuevo</p>
                </form>

                <form id="form-reg" class="hidden">
                    <h3 class="text-center mb-4">Registro Médico</h3>
                    <input type="text" id="reg-name" class="input-std mb-3" placeholder="Nombre Completo" required>
                    <input type="email" id="reg-email" class="input-std mb-3" placeholder="Correo" required>
                    <input type="password" id="reg-pass" class="input-std mb-3" placeholder="Contraseña" required>
                    <input type="password" id="reg-key" class="input-std mb-4" placeholder="Clave Maestra" required>
                    <button type="submit" class="btn-white btn-block btn-lg">Registrar</button>
                    <p class="auth-switch" id="btn-to-login">Volver</p>
                </form>
            </div>
        </div>

        <div id="view-dashboard" class="screen hidden">
            <header class="app-header">
                <div class="header-top">
                    <div class="flex-align">
                        <div class="logo-mini">!</div>
                        <h2>Pacientes</h2>
                    </div>
                    <button class="btn-icon-sm" id="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
                </div>
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="census">Censo</button>
                    <button class="tab-btn" data-tab="schedule">Agenda</button>
                    <button class="tab-btn" data-tab="discharges">Egresos</button>
                </div>
            </header>

            <main class="content-area">
                <div id="census-filters" class="filter-row">
                    <select id="filter-hospital" class="select-pill"><option value="">Todos los Hospitales</option></select>
                    <select id="filter-doctor" class="select-pill"><option value="">Todos los Médicos</option></select>
                </div>

                <div id="list-container" class="list-wrapper"></div>
                
                <div id="empty-state" class="empty-state hidden">
                    <i class="fas fa-moon"></i>
                    <p>No hay pacientes registrados</p>
                </div>
            </main>

            <button id="fab-add" class="fab"><i class="fas fa-plus"></i></button>
        </div>

        <div id="view-detail" class="screen hidden slide-in-right">
            <header class="detail-header">
                <button class="btn-back" id="btn-back"><i class="fas fa-arrow-left"></i> Atrás</button>
                <span class="header-title">Expediente</span>
                <button class="btn-menu" id="btn-actions"><i class="fas fa-ellipsis-v"></i></button>
            </header>

            <div class="detail-body">
                <div class="patient-card-large">
                    <div class="card-top">
                        <div class="avatar-large" id="det-avatar">XX</div>
                        <div class="info-large">
                            <h2 id="det-name">Nombre Paciente</h2>
                            <p><span id="det-age">00</span> años • <span id="det-hosp" class="badge-hosp">HOSP</span></p>
                        </div>
                    </div>
                    <div class="card-meta-grid">
                        <div class="meta-item"><label>Diagnóstico</label><span id="det-dx">...</span></div>
                        <div class="meta-item"><label>Seguro</label><span id="det-insurance">...</span></div>
                    </div>
                    <div class="visit-row" id="box-visit-toggle">
                        <label class="switch">
                            <input type="checkbox" id="chk-visit-today">
                            <span class="slider round"></span>
                        </label>
                        <span class="visit-label">Visita Hoy</span>
                    </div>
                </div>

                <div class="detail-tabs">
                    <button class="d-tab active" data-target="info">Datos Clínicos</button>
                    <button class="d-tab" data-target="notes">Notas</button>
                </div>

                <div id="panel-info" class="d-panel active">
                    <div class="section-box">
                        <h3>Identificación</h3>
                        <div class="input-row">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="det-phone" placeholder="Teléfono">
                        </div>
                        <hr class="divider">
                        <h4>Antecedentes</h4>
                        <div class="chips-group">
                            <label class="chip"><input type="checkbox" id="ant-dm"> DM</label>
                            <label class="chip"><input type="checkbox" id="ant-has"> HAS</label>
                            <label class="chip"><input type="checkbox" id="ant-hipo"> HipoT</label>
                            <label class="chip"><input type="checkbox" id="ant-onco"> Onco</label>
                        </div>
                        <textarea id="det-history" placeholder="Alergias, Qx previas..."></textarea>
                        <textarea id="det-meds" placeholder="Medicamentos..."></textarea>
                        <button id="btn-save-clinical" class="btn-outline full-width mt-3">Guardar</button>
                    </div>
                </div>

                <div id="panel-notes" class="d-panel hidden">
                    <div class="notes-grid-menu">
                        <button onclick="app.openNote('visita')"><i class="fas fa-user-md"></i> Visita</button>
                        <button onclick="app.openNote('labs')"><i class="fas fa-vial"></i> Labs</button>
                        <button onclick="app.openNote('signos')"><i class="fas fa-heartbeat"></i> Signos</button>
                        <button onclick="app.openNote('libre')"><i class="fas fa-pen"></i> Nota</button>
                        <button onclick="app.openNote('check_qx')" class="btn-special">Check Qx</button>
                        <button onclick="app.openNote('check_egr')" class="btn-special">Check Egr</button>
                    </div>
                    <div id="timeline-container" class="timeline"></div>
                </div>
            </div>
        </div>

        <div id="modal-add" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-head"><h3>Nuevo Paciente</h3><button class="close-modal">&times;</button></div>
                <form id="form-add">
                    <div class="form-scroll">
                        <label>Hospital</label><select id="add-hospital" class="input-std mb-3" required></select>
                        <input id="add-hosp-other" class="input-std mb-3 hidden" placeholder="Especifique">
                        <label>Nombre</label><input id="add-name" class="input-std mb-3" required>
                        <div class="row">
                            <div class="col"><label>F. Nac</label><input type="date" id="add-dob" class="input-std" required></div>
                            <div class="col"><label>Tipo</label><select id="add-type" class="input-std"><option>Médico</option><option>Quirúrgico</option><option>Interconsulta</option></select></div>
                        </div>
                        <label class="mt-3">Diagnóstico</label><input id="add-dx" class="input-std mb-3" required>
                        <label>Médico</label><select id="add-doc" class="input-std mb-3"></select>
                        <input id="add-doc-other" class="input-std mb-3 hidden" placeholder="Otro Médico">
                        <label>Seguro</label><select id="add-insurance" class="input-std mb-3"></select>
                        <input id="add-ins-other" class="input-std mb-3 hidden" placeholder="Otro Seguro">
                    </div>
                    <button type="submit" class="btn-primary full-width mt-3">Guardar Ficha</button>
                </form>
            </div>
        </div>

        <div id="action-sheet" class="action-sheet hidden">
            <div class="sheet-content">
                <div class="sheet-handle"></div>
                <h3 class="text-center mb-4">Opciones</h3>
                <div id="actions-census" class="actions-group hidden">
                    <button onclick="app.markPreDischarge()" class="btn-sheet purple"><i class="fas fa-file-export"></i> Pre-Alta</button>
                    <button onclick="app.openScheduleModal()" class="btn-sheet blue"><i class="fas fa-calendar-alt"></i> Programar</button>
                    <button onclick="app.dischargePatient()" class="btn-sheet red"><i class="fas fa-door-open"></i> Egresar</button>
                </div>
                <div id="actions-schedule" class="actions-group hidden">
                    <button onclick="app.returnToCensus()" class="btn-sheet gray"><i class="fas fa-undo"></i> Regresar al Censo</button>
                    <button onclick="app.dischargePatient()" class="btn-sheet red"><i class="fas fa-check-circle"></i> Terminado / Egresar</button>
                </div>
                <div id="actions-discharge" class="actions-group hidden">
                    <button onclick="app.returnToCensus()" class="btn-sheet gray"><i class="fas fa-undo"></i> Reingresar</button>
                </div>
                <button onclick="app.closeSheet()" class="btn-sheet cancel">Cancelar</button>
            </div>
        </div>

        <div id="modal-schedule" class="modal-overlay hidden">
            <div class="modal-card small">
                <h3>Programar</h3>
                <input type="date" id="sched-date" class="input-std mt-3 mb-3">
                <button id="btn-confirm-schedule" class="btn-primary full-width">Confirmar Fecha</button>
                <button class="btn-text full-width mt-2 close-sched">Cancelar</button>
            </div>
        </div>

        <div id="modal-note" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-head"><h3 id="note-title">Nota</h3><button class="close-note">&times;</button></div>
                <form id="form-note">
                    <div id="note-fields" class="form-scroll"></div>
                    <button type="submit" class="btn-primary full-width mt-3">Guardar</button>
                    <button type="button" id="btn-wa" class="btn-whatsapp full-width mt-2 hidden"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                </form>
            </div>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
